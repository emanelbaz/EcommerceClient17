<section class="checkout-section py-5">
  <div class="container">
    <h2 class="mb-4 fw-bold text-center">Checkout</h2>

    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">

            <form [formGroup]="checkoutForm" (ngSubmit)="submitFrom()">

              <!-- SHIPPING ADDRESS -->
              <div formGroupName="shippingAddress" class="mb-4">
                <h4 class="fw-bold mb-3">Shipping Address</h4>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label">First Name</label>
                    <input
                      formControlName="firstName"
                      type="text"
                      class="form-control"
                      placeholder="First name"
                    />
                  </div>

                  <div class="col-md-6 mb-3">
                    <label class="form-label">Last Name</label>
                    <input
                      formControlName="lastName"
                      type="text"
                      class="form-control"
                      placeholder="Last name"
                    />
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label">Street</label>
                  <input
                    formControlName="street"
                    type="text"
                    class="form-control"
                    placeholder="Street address"
                  />
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label">City</label>
                    <input
                      formControlName="city"
                      type="text"
                      class="form-control"
                      placeholder="City"
                    />
                  </div>

                  <div class="col-md-6 mb-3">
                    <label class="form-label">Country</label>
                    <input
                      formControlName="country"
                      type="text"
                      class="form-control"
                      placeholder="Country"
                    />
                  </div>
                </div>
              </div>

              <hr />

              <!-- CONTACT INFO -->
              <div class="mb-4">
                <h4 class="fw-bold mb-3">Contact Information</h4>

                <div class="mb-3">
                  <label class="form-label">Email Address</label>
                  <input
                    type="email"
                    formControlName="email"
                    class="form-control"
                    placeholder="name@example.com"
                  />
                </div>
              </div>

              <hr />

              <!-- SHIPPING METHOD -->
              <div class="mb-4">
                <h4 class="fw-bold mb-3">Shipping Method</h4>

                @for (method of shippingMethods; track $index) {
                  <div class="form-check mb-2">
                    <input
                      class="form-check-input"
                      type="radio"
                      formControlName="shippingMethod"
                      [value]="method.id"
                      id="ship-{{ method.id }}"
                    />
                    <label class="form-check-label" for="ship-{{ method.id }}">
                      {{ method.label }}
                    </label>
                  </div>
                }
              </div>

              <hr />

              <!-- PAYMENT METHOD -->
              <div class="mb-4">
                <h4 class="fw-bold mb-3">Payment Method</h4>

                @for (method of paymentMethods; track $index) {
                  <div class="form-check mb-2">
                    <input
                      class="form-check-input"
                      type="radio"
                      formControlName="paymentMethod"
                      [value]="method.id"
                      id="pay-{{ method.id }}"
                    />
                    <label class="form-check-label" for="pay-{{ method.id }}">
                      {{ method.label }}
                    </label>
                  </div>
                }
              </div>

              <!-- SUBMIT -->
              <div class="d-grid mt-4">
                <button
                  class="checkout-btn btn btn-success btn-lg cursor-pointer"
                  type="submit"
                  [disabled]="checkoutForm.invalid"
                >
                  Place Order
                </button>
              </div>

            </form>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>
